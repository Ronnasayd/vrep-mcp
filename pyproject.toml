[project]
name = "vrep-mcp"
version = "0.1.0"
description = "MCP server exposing the whole CoppeliaSim (V-REP) API through 4 tools"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastmcp>=2.0,<3",
    "coppeliasim-zmqremoteapi-client>=2.0,<3",
    "fastembed>=0.4,<1",
    "numpy>=1.26,<3",
]

[project.scripts]
vrep-mcp = "vrep_mcp.server:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrep_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the real embedding model (downloads on first run)",
    "sim: needs a running CoppeliaSim on VREP_HOST:VREP_PORT",
]
